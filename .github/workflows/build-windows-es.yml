name: Build Windows ES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 en español
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restaurar caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - name: Configurar MSVC para ASIO
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $install) { throw 'No se encontró Visual Studio con el conjunto de herramientas C++ x64' }
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "No se encontró vcvars64.bat en $vcvars" }

          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $oldPath = $env:PATH -split ';'

          cmd /c "call `"$vcvars`" >nul && set" | ForEach-Object {
            $name, $value = $_ -split '=', 2
            if (-not $name -or $null -eq $value) { return }
            if ($name -eq 'PATH') {
              ($value -split ';') |
                Where-Object { $_ -and ($oldPath -notcontains $_) } |
                Add-Content -Path $env:GITHUB_PATH -Encoding utf8
            } elseif ($before[$name] -ne $value) {
              "$name=$value" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
            }
          }

      - name: Configurar ASIO
        shell: bash
        run: |
          echo "CPAL_ASIO_DIR=${GITHUB_WORKSPACE}/third-party/asio" >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar formato y código
        run: pnpm lint

      - name: Compilar la interfaz
        run: pnpm build

      - name: Ejecutar pruebas de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Crear instaladores EXE y MSI
        run: pnpm tauri build --bundles nsis,msi

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: metermaid-windows-x64-es
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
